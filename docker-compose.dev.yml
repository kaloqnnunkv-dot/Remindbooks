# ------------------------------------------------------------------
#  Само база данни — за ежедневна разработка.
#
#  Приложението се стартира на хоста с `npm run dev`, което дава мигновено
#  презареждане при промяна. Пълният стек в Docker изисква повторен build
#  при всяка промяна, което е бавно за разработка.
#
#    docker compose -f docker-compose.dev.yml up -d
#    npm run dev
# ------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: remindbooks-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: remindbooks
      POSTGRES_PASSWORD: remindbooks
      POSTGRES_DB: remindbooks
    ports:
      - "5432:5432"
    volumes:
      - db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remindbooks -d remindbooks"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data-dev:
